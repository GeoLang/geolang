  // ── Session persistence ────────────────────────
  const SESSION_KEY_PREFIX = 'geolang_chat_';

  function getSessionKey() {
    return currentSessionId ? SESSION_KEY_PREFIX + currentSessionId : 'geolang_chat';
  }

  function saveSession() {
    const key = getSessionKey();
    try {
      const json = JSON.stringify(messageHistory);
      localStorage.setItem(key, json);
      // Also keep a 'last known good' fallback so history survives session ID changes
      localStorage.setItem('geolang_chat_last', json);
      console.debug('[history] saved', messageHistory.length, 'messages under', key);
    } catch (e) {
      console.warn('[history] saveSession failed:', e);
    }
  }

  function restoreSession() {
    const key = getSessionKey();
    let saved = null;
    // Try current session key first, then last-known fallback
    for (const k of [key, 'geolang_chat_last', 'geolang_chat']) {
      try {
        const raw = localStorage.getItem(k);
        if (raw) { saved = JSON.parse(raw); }
      } catch (e) {}
      if (saved && saved.length) {
        console.debug('[history] restored', saved.length, 'messages from key:', k);
        break;
      }
    }
    if (!saved || !saved.length) {
      console.debug('[history] nothing to restore for key:', key);
      return;
    }
    const welcome = document.getElementById('welcome-msg');
    if (welcome) welcome.style.display = 'none';
    messageHistory = saved;
    saved.forEach(m => {
      try { addMessage(m.role, m.text, true, m.spec || null); }
      catch (e) { console.warn('[history] could not restore message:', e, m); }
    });
  }

  // ── Basemap switcher ───────────────────────────
  let baseTile = null;

  const BASEMAPS = {
    osm: {
      url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      attribution: '© OpenStreetMap',
      maxZoom: 19,
    },
    satellite: {
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      attribution: 'Tiles © Esri',
      maxZoom: 19,
    },
    topo: {
      url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      attribution: '© OpenTopoMap',
      maxZoom: 17,
    },
    dark: {
      url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      attribution: '© CartoDB',
      maxZoom: 19,
    },
  };

  function switchBasemap(key) {
    if (!map) return;
    if (baseTile) { map.removeLayer(baseTile); baseTile = null; }
    const cfg = BASEMAPS[key];
    if (!cfg) return;
    baseTile = L.tileLayer(cfg.url, { attribution: cfg.attribution, maxZoom: cfg.maxZoom, noWrap: true });
    baseTile.addTo(map);
    baseTile.bringToBack();
    // Toggle dim filter: OSM/dark dim for contrast; satellite/topo show full colour
    let styleEl = document.getElementById('basemap-filter-style');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'basemap-filter-style';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = (key === 'satellite' || key === 'topo')
      ? '.leaflet-tile { filter: none !important; }'
      : '';
  }

  // Extended initMap: captures base tile and sets up draw/click-query
  function initMap(center, zoom) {
    if (map) return;
    map = L.map('map', {
      center, zoom,
      maxBounds: [[-90, -180], [90, 180]],
      maxBoundsViscosity: 1.0,
    });
    baseTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19, noWrap: true,
    }).addTo(map);
    L.control.scale({ position: 'bottomright', imperial: false }).addTo(map);
  }

  // ── Leaflet.draw ───────────────────────────────
  let drawControl = null;
  let drawnItems = null;
  let drawActive = false;

  function initDrawControls() {
    if (!map || !L.Control || !L.Control.Draw) return;
    drawnItems = new L.FeatureGroup().addTo(map);
    drawControl = new L.Control.Draw({
      position: 'topleft',
      draw: {
        polygon: { shapeOptions: { color: '#a78bfa', fillOpacity: 0.15 } },
        rectangle: { shapeOptions: { color: '#a78bfa', fillOpacity: 0.15 } },
        circle: false,
        polyline: false,
        circlemarker: false,
        marker: { icon: L.divIcon({ className: '', html: '<div style="width:12px;height:12px;background:#a78bfa;border-radius:50%;border:2px solid #fff"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) },
      },
      edit: { featureGroup: drawnItems, remove: true },
    });
    // Don't add to map yet — toggled by button
    map.on(L.Draw.Event.CREATED, async (e) => {
      drawnItems.clearLayers();
      drawnItems.addLayer(e.layer);

      const geojson = e.layer.toGeoJSON();
      const geomType = geojson.geometry.type;
      const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 16);
      const name = `drawn_${geomType.toLowerCase()}_${ts}`;

      // POST to /draw
      try {
        const res = await fetch(`${API}/draw`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ geojson, name }),
        });
        if (res.ok) {
          const data = await res.json();
          // Inject a user message so the agent knows and can act on it
          const userMsg = `I drew a ${geomType} on the map (saved as ${data.filename}). What can you tell me about this area? Show me what's inside it.`;
          document.getElementById('input').value = userMsg;
          // Keep draw mode off after drawing
          if (drawActive) toggleDraw();
        }
      } catch (err) {
        console.error('Draw save failed:', err);
      }
    });
  }

  function toggleDraw() {
    if (!map) return;
    drawActive = !drawActive;
    const btn = document.getElementById('draw-btn');
    btn.classList.toggle('active', drawActive);
    if (drawActive) {
      map.addControl(drawControl);
    } else {
      map.removeControl(drawControl);
    }
  }

  // ── Map click to query ─────────────────────────
  let clickQueryActive = false;
  let mapClickHandler = null;

  function initClickQuery() {
    // Stub — handler installed when toggled on
  }

  function toggleClickQuery() {
    if (!map) return;
    clickQueryActive = !clickQueryActive;
    const btn = document.getElementById('click-query-btn');
    btn.classList.toggle('active', clickQueryActive);

    if (clickQueryActive) {
      map.getContainer().style.cursor = 'crosshair';
      mapClickHandler = async (e) => {
        const lat = e.latlng.lat.toFixed(5);
        const lon = e.latlng.lng.toFixed(5);

        // Flash toast
        const toast = document.getElementById('map-click-toast');
        toast.textContent = `Querying ${lat}, ${lon}…`;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2500);

        // Inject into chat
        const msg = `I clicked the map at latitude ${lat}, longitude ${lon}. Use query_elevation to get the elevation and flood risk. Use assess_environmental_risk with place_name="${lat},${lon}" and radius_km=1. Use download_osm_data to find nearby amenities (restaurants, shops, hospitals) within 500m. Then summarise what is at this location.`;
        document.getElementById('input').value = msg;
        // Turn off click query mode
        toggleClickQuery();
        sendMessage();
      };
      map.on('click', mapClickHandler);
    } else {
      map.getContainer().style.cursor = '';
      if (mapClickHandler) { map.off('click', mapClickHandler); mapClickHandler = null; }
    }
  }

  // ── Suggested follow-ups ───────────────────────
  const FOLLOWUP_SETS = [
    // Triggered by keywords in agent response (checked in order)
    { keywords: ['isochrone', 'catchment', 'travel time', 'walk', 'drive', 'cycle'],
      suggestions: ['How many people live within this area?', 'Find hospitals inside this catchment', 'Show restaurants within this zone'] },
    { keywords: ['population', 'people live'],
      suggestions: ['Show as a choropleth map', 'Compare with a different location', 'Export as PDF report'] },
    { keywords: ['restaurant', 'cafe', 'shop', 'amenity', 'hospital', 'school'],
      suggestions: ['Show a heatmap of these locations', 'Which ones fall inside my drawn area?', 'Find the nearest one to a point'] },
    { keywords: ['flood', 'elevation', 'risk', 'environmental'],
      suggestions: ['Compare with a different location', 'Show the admin boundary for this area', 'Export as PDF report'] },
    { keywords: ['score', 'rank', 'best location', 'site'],
      suggestions: ['Show these on a heatmap', 'Add competition as a criterion', 'Export results as PDF'] },
    { keywords: ['boundary', 'outline', 'district', 'region', 'county'],
      suggestions: ['Download OSM data inside this boundary', 'How many people live here?', 'Clip my data to this boundary'] },
    { keywords: ['route', 'directions', 'travel'],
      suggestions: ['Show alternative routes', 'What is the travel time catchment from here?', 'Export as PDF report'] },
    { keywords: ['geocoded', 'address', 'addresses'],
      suggestions: ['Show a heatmap of these locations', 'Find the nearest hospital to each', 'Export as PDF report'] },
  ];
  const DEFAULT_FOLLOWUPS = ['Show a heatmap of these results', 'Export as PDF report', 'Get the admin boundary for this area'];

  function getFollowups(agentText) {
    const lower = agentText.toLowerCase();
    for (const set of FOLLOWUP_SETS) {
      if (set.keywords.some(kw => lower.includes(kw))) {
        return set.suggestions;
      }
    }
    return DEFAULT_FOLLOWUPS;
  }

  function addFollowupSuggestions(agentEl, agentText) {
    const suggestions = getFollowups(agentText);
    const row = document.createElement('div');
    row.className = 'followup-row';
    suggestions.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'followup-btn';
      btn.textContent = s;
      btn.onclick = () => {
        row.remove();
        document.getElementById('input').value = s;
        sendMessage();
      };
      row.appendChild(btn);
    });
    agentEl.appendChild(row);
  }

  // ── PDF export ─────────────────────────────────
  async function exportPDF() {
    const layers = layerMeta.map(lm => lm.file);
    const summaryEl = document.querySelector('.message.agent:last-of-type div:last-child');
    const summary = summaryEl ? summaryEl.textContent : '';

    const btn = document.querySelector('.map-action-btn[onclick="exportPDF()"]');
    if (btn) { btn.textContent = '⏳ Exporting…'; btn.disabled = true; }

    try {
      const res = await fetch(`${API}/export-pdf`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('session-name')?.value || 'GeoLang Analysis Report',
          summary,
          layers,
          center: map ? [map.getCenter().lat, map.getCenter().lng] : [20, 0],
          zoom: map ? map.getZoom() : 2,
          basemap: document.getElementById('basemap-select')?.value || 'osm',
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      const a = document.createElement('a');
      a.href = `${API}${data.download_url}`;
      a.download = data.pdf_filename;
      a.click();
    } catch (e) {
      alert('PDF export failed: ' + e.message);
    } finally {
      if (btn) { btn.textContent = '⬇ PDF'; btn.disabled = false; }
    }
  }

  // ── PNG export (Playwright server-side screenshot) ────────────────────
  async function exportPNG() {
    const center = map ? [map.getCenter().lat, map.getCenter().lng] : [20, 0];
    const zoom = map ? map.getZoom() : 2;
    const basemap = document.getElementById('basemap-select')?.value || 'osm';
    const layers = layerMeta.map(lm => lm.file);
    const btn = document.querySelector('.map-action-btn[onclick="exportPNG()"]');
    if (btn) { btn.textContent = '⏳ Capturing…'; btn.disabled = true; }
    try {
      const res = await fetch(`${API}/export-png`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ center, zoom, basemap, layers }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      const a = document.createElement('a');
      a.href = `${API}${data.download_url}`;
      a.download = data.png_filename;
      a.click();
    } catch (e) {
      alert('PNG export failed: ' + e.message);
    } finally {
      if (btn) { btn.textContent = '⬇ PNG'; btn.disabled = false; }
    }
  }

  // ── Map search box ─────────────────────────────
  async function mapSearch() {
    const input = document.getElementById('map-search-input');
    const q = input.value.trim();
    if (!q) return;

    // Try lat,lon first
    const coordM = q.match(/^\s*(-?\d+\.?\d*)[,\s]+(-?\d+\.?\d*)\s*$/);
    if (coordM) {
      const lat = parseFloat(coordM[1]), lon = parseFloat(coordM[2]);
      if (map) map.setView([lat, lon], 13);
      input.value = '';
      return;
    }

    // Nominatim geocode
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const data = await res.json();
      if (data && data.length > 0) {
        const { lat, lon, display_name } = data[0];
        if (map) map.setView([parseFloat(lat), parseFloat(lon)], 13);
        input.value = '';
        // Brief marker
        const marker = L.marker([parseFloat(lat), parseFloat(lon)])
          .bindPopup(display_name.split(',').slice(0, 3).join(', '))
          .addTo(map)
          .openPopup();
        setTimeout(() => map && map.removeLayer(marker), 4000);
      } else {
        input.style.borderColor = '#ef4444';
        setTimeout(() => { input.style.borderColor = ''; }, 1500);
      }
    } catch (e) {
      console.warn('Map search failed:', e);
    }
  }

  // ── Attribute table ────────────────────────────
  function openAttrTable(lm) {
    const modal = document.getElementById('attr-table-modal');
    const title = document.getElementById('attr-table-title');
    const thead = document.querySelector('#attr-table thead');
    const tbody = document.querySelector('#attr-table tbody');

    if (!lm.geojsonCache || !lm.geojsonCache.features || !lm.geojsonCache.features.length) return;

    title.textContent = `Attribute Table — ${lm.name} (${lm.geojsonCache.features.length} rows)`;

    const features = lm.geojsonCache.features;
    const cols = features.length ? Object.keys(features[0].properties || {}) : [];

    thead.innerHTML = '<tr>' + cols.map(c => `<th title="${c}">${c}</th>`).join('') + '</tr>';

    // Show first 500 rows max
    const rows = features.slice(0, 500).map(f => {
      const props = f.properties || {};
      return '<tr>' + cols.map(c => {
        const v = props[c];
        const str = v === null || v === undefined ? '' : String(v);
        return `<td title="${str.replace(/"/g, '&quot;')}">${str}</td>`;
      }).join('') + '</tr>';
    });
    tbody.innerHTML = rows.join('');

    modal.style.display = 'flex';
  }

  function closeAttrTable() {
    document.getElementById('attr-table-modal').style.display = 'none';
  }

  // ── Shareable links ────────────────────────────
  async function shareMap() {
    const btn = document.getElementById('share-btn');
    if (btn) { btn.textContent = '⏳…'; btn.disabled = true; }

    try {
      const summaryEl = document.querySelector('.message.agent:last-of-type div:last-child');
      const summary = summaryEl ? summaryEl.textContent.slice(0, 500) : '';
      const center = map ? [map.getCenter().lng, map.getCenter().lat] : [];
      const zoom = map ? map.getZoom() : 12;

      const res = await fetch(`${API}/share`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('session-name')?.value || 'GeoLang Analysis',
          summary,
          layers: layerMeta.map(lm => lm.file),
          center,
          zoom,
        }),
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();

      const shareUrl = `${window.location.origin}${data.url}`;
      await navigator.clipboard.writeText(shareUrl).catch(() => {});

      const toast = document.getElementById('share-toast');
      toast.innerHTML = `Link copied to clipboard!<br><a href="${shareUrl}" target="_blank" style="color:#a78bfa">${shareUrl}</a>`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 5000);
    } catch (e) {
      alert('Share failed: ' + e.message);
    } finally {
      if (btn) { btn.textContent = '↗ Share'; btn.disabled = false; }
    }
  }

  // ── On load: check for ?share= param ──────────
  (async function checkShareParam() {
    const path = window.location.pathname;
    // url-safe base64, the shape secrets.token_urlsafe gives the share route
    const m = path.match(/\/share\/([A-Za-z0-9_-]+)/);
    if (!m) return;
    const shareId = m[1];
    try {
      const res = await fetch(`${API}/share/${shareId}/data`);
      if (!res.ok) return;
      const data = await res.json();
      // Restore view
      if (data.center && data.center.length === 2) {
        initMap(data.center.slice().reverse(), data.zoom || 12);
        if (map) map.setView([data.center[1], data.center[0]], data.zoom || 12);
      }
      if (data.layers && data.layers.length) {
        await renderUISpec({ type: 'map', layers: data.layers.map(f => ({ file: f, name: f.replace('outputs/', '').replace('.gpkg', '') })), center: data.center, zoom: data.zoom });
      }
      if (data.title) document.title = data.title + ' — GeoLang';
      if (data.summary) {
        const chat = document.getElementById('messages');
        if (chat) {
          const el = document.createElement('div');
          el.className = 'message agent';
          el.innerHTML = `<strong>Shared analysis:</strong> ${data.summary}`;
          chat.appendChild(el);
        }
      }
    } catch (e) {
      // silently ignore
    }
  })();

  // ── Screenshot mode (used by /export-png Playwright) ─────────────────
  (function handleScreenshotParam() {
    const params = new URLSearchParams(window.location.search);
    if (!params.has('screenshot')) return;
    document.querySelector('header').style.display = 'none';
    document.querySelector('.chat-panel') && (document.querySelector('.chat-panel').style.display = 'none');
    document.getElementById('layer-panel') && (document.getElementById('layer-panel').style.display = 'none');
    const lat = parseFloat(params.get('lat') || '20');
    const lon = parseFloat(params.get('lon') || '0');
    const zoom = parseInt(params.get('zoom') || '10', 10);
    const basemap = params.get('basemap') || 'osm';
    const layersParam = params.get('layers') || '';
    const title = params.get('title') || '';
    const summary = params.get('summary') || '';
    initMap([lat, lon], zoom);
    if (basemap !== 'osm') switchBasemap(basemap);
    if (layersParam) {
      const files = layersParam.split(',').filter(Boolean);
      renderUISpec({
        type: 'map',
        layers: files.map(f => ({ file: f, name: f.replace(/\.gpkg$/i, '').replace(/_/g, ' ') })),
        center: [lon, lat],
        zoom,
      });
    }
    if (title || summary) {
      const bar = document.createElement('div');
      bar.style.cssText = 'position:absolute;bottom:0;left:0;right:0;z-index:1000;background:rgba(15,17,23,0.88);padding:10px 16px;font-family:sans-serif;';
      if (title) {
        const h = document.createElement('div');
        h.style.cssText = 'color:#e2e8f0;font-size:13px;font-weight:600;margin-bottom:4px;';
        h.textContent = title;
        bar.appendChild(h);
      }
      if (summary) {
        const p = document.createElement('div');
        p.style.cssText = 'color:#94a3b8;font-size:11px;line-height:1.4;';
        p.textContent = summary.slice(0, 400) + (summary.length > 400 ? '…' : '');
        bar.appendChild(p);
      }
      const ts = document.createElement('div');
      ts.style.cssText = 'color:#475569;font-size:10px;margin-top:4px;';
      ts.textContent = `Generated by GeoLang · ${new Date().toLocaleString()}`;
      bar.appendChild(ts);
      document.getElementById('map').appendChild(bar);
    }
  })();

  // ── Startup ────────────────────────────────────
  initMap([20, 0], 2);
  initDrawControls();
  checkHealth();
  loadDatasets();
  // Load sessions first (sets currentSessionId), then restore history for that session
  loadSessions().then(() => restoreSession());
  setInterval(checkHealth, 15000);
  document.getElementById('input').focus();
</script>
</body>
</html>
