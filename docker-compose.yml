services:
  letta-gis:
    image: letta-gis:latest
    volumes:
      # Use a relative path so the mount tracks wherever this compose file lives —
      # avoids the previous case-mismatch (`~/src/geolang` vs `~/src/GeoLang/geolang`)
      # which caused docker to auto-create an empty stub directory and mount that.
      - .:/app/geolang:z
      - ${HOME}/.letta/.persist/pgdata:/var/lib/postgresql/data:z
    environment:
      TOOL_EXEC_DIR: "/app/geolang"
      TOOL_EXEC_VENV_NAME: "env"
      XAI_API_KEY: "${XAI_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      VLLM_API_BASE: "http://localhost:8000"
      QT_QPA_PLATFORM: "offscreen"
      QGIS_PREFIX_PATH: "/usr"
      PYTHONPATH: "/usr/lib/python3/dist-packages:/usr/lib/qgis/python:${PYTHONPATH}"
      LD_LIBRARY_PATH: "/usr/lib/qgis:${LD_LIBRARY_PATH}"
    ports:
      - "8283:8283"