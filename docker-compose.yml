services:
  geolang:
    image: geolang:latest
    build: .
    volumes:
      # Use a relative path so the mount tracks wherever this compose file lives —
      # avoids the previous case-mismatch (`~/src/geolang` vs `~/src/GeoLang/geolang`)
      # which caused docker to auto-create an empty stub directory and mount that.
      - .:/app/geolang:z
    environment:
      # the standalone stack has no platform to mint tokens against, so it opts
      # out of the gate. Never set this where the port is reachable.
      GEOLANG_ALLOW_UNAUTHENTICATED: "1"
      TOOL_EXEC_DIR: "/app/geolang"
      # empty when it is not in .env, which the API reads as the 30-day default
      GEOLANG_OUTPUTS_RETENTION_DAYS: "${GEOLANG_OUTPUTS_RETENTION_DAYS}"
      SIBYL_URL: "http://sibyl:8090"
      QT_QPA_PLATFORM: "offscreen"
      QGIS_PREFIX_PATH: "/usr"
      PYTHONPATH: "/usr/lib/python3/dist-packages:/usr/lib/qgis/python"
      LD_LIBRARY_PATH: "/usr/lib/qgis"
    ports:
      - "8080:8080"

  sibyl:
    build: ../sibyl
    environment:
      XAI_API_KEY: "${XAI_API_KEY}"
      GEOLANG_URL: "http://geolang:8080"
      SIBYL_DB_PATH: "/data/sibyl.db"
    volumes:
      - sibyl-data:/data
    ports:
      - "8090:8090"

volumes:
  sibyl-data:
