id = "add-a-wms-service"
prompt = "add the WMS at https://example.org/geoserver/wms as a layer called Soils"
notes = "The service kind is one of a fixed set, and the layer name is required."

[expect]
action = "run"
name = "data.add_service"
args = { type = "wms", url = "https://example.org/geoserver/wms", name = "Soils" }
