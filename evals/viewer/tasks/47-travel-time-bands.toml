id = "travel-time-bands"
prompt = "draw how far a bicycle gets from longitude -0.128, latitude 51.507 in bands 10,20 minutes"
notes = "The band list is given the way the action spells it, so its format is not guessed."

[expect]
action = "run"
name = "analysis.travel_time"
args = { lon = -0.128, lat = 51.507, bands = "10,20", profile = "bicycle" }

[tolerance]
lon = 0.001
lat = 0.001
