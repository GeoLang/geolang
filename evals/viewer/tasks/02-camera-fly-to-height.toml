id = "camera-fly-to-height"
prompt = "look at longitude -0.1276, latitude 51.5072 from 2000 metres up"
notes = "An optional parameter the prompt names has to be carried through."

[expect]
action = "run"
name = "camera.fly_to"
args = { lon = -0.1276, lat = 51.5072, height = 2000.0 }

[tolerance]
lon = 0.001
lat = 0.001
height = 1.0
