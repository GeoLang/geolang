id = "unique-values-on-the-countries"
prompt = "use a unique values symbology on the countries"
notes = "Unique values is the ArcGIS name for QGIS categorized symbology, which layers.shade_by draws for a text column. The country name column in Natural Earth is NAME."

[expect]
action = "run"
name = "layers.shade_by"
args = { layer = "European countries", column = "NAME" }

[snapshot]
camera = { longitude = 10.0, latitude = 50.0, zoom = 4, pitch = 0, bearing = 0 }

[[snapshot.layers]]
id = "lyr_europe_countries"
name = "European countries"
kind = "agent"
visible = true
opacity = 1
