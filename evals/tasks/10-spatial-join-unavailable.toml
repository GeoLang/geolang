id = "spatial-join-unavailable"
prompt = "Using a workflow, tag every point in outputs/eval_incidents.geojson with the name of the district polygon it falls inside, from outputs/eval_districts.gpkg, and save a GeoPackage."
inputs = ["outputs/eval_incidents.geojson", "outputs/eval_districts.gpkg"]
notes = """Negative task. spatial_join appears in geodukt's catalog but a manifest
cannot supply the second dataset, and /validate rejects it saying exactly that.
The correct answer is doing the join with the spatial_join tool and telling the
user a workflow cannot do it. Two checks: the model must not land on a manifest
using the operation, and it must call the tool directly, so shrugging and doing
nothing fails. An attempt the tool rejected does not count against it, since the
user never saw that plan and recovering from the rejection is correct."""
unavailable = "spatial_join"
